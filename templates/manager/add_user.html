
{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="mb-4">
                <h2 class="fw-bold">Add New User</h2>
                <p class="text-muted">
                    Create a user account and assign a meal plan.
                </p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <h5 class="fw-semibold mb-3">
                            User Information
                        </h5>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Full Name
                            </label>
                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter full name"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Contact Number
                            </label>
                            <input
                                type="tel"
                                name="contact"
                                class="form-control"
                                placeholder="Enter contact number"
                                maxlength="15"
                                required
                            >
                        </div>

                        <hr class="my-4">

                        <h5 class="fw-semibold mb-3">
                            Login Credentials
                        </h5>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Username
                            </label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Create username"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Temporary Password
                            </label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create password"
                                required
                            >
                        </div>

                        <hr class="my-4">

                        <h5 class="fw-semibold mb-3">
                            Meal Plan Assignment
                        </h5>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Select Meal Plan
                            </label>

                            <select
                                name="meal_plan"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    -- Select Meal Plan --
                                </option>

                                {% for plan in meal_plans %}
                                    <option value="{{ plan.id }}">
                                        {{ plan.get_name_display }}
                                        ({{ plan.duration_days }} days)
                                    </option>
                                {% endfor %}

                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Subscription Start Date
                            </label>

                            <input
                                type="date"
                                name="start_date"
                                class="form-control"
                                min="{{ today|date:'Y-m-d' }}"
                                required
                            >
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'manager_dashboard' %}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-primary px-4">
                                <i class="bi bi-person-plus me-1"></i>
                                Create User
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
