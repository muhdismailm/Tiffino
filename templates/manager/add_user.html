{% extends 'base.html' %}{% block title %}Add User | Tiffino{% endblock %}{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h1>Create User</h1>
        <form method="post">{% csrf_token %}{% if form %}{{ form.as_p }}{% else %}
            <label class="form-label">Name</label><input class="form-control mb-3" name="name" required><label
                class="form-label">Username</label><input class="form-control mb-3" name="username" required><label
                class="form-label">Contact</label><input class="form-control mb-3" name="contact"><label
                class="form-label">Password</label><input type="password" class="form-control mb-3" name="password"
                required>{% endif %}<button class="btn btn-primary">Create User</button>
        </form>
    </div>
</div>{% endblock %}
