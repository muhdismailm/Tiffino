{% extends 'base.html' %}{% block title %}Users | Tiffino{% endblock %}{% block content %}
<div class="d-flex justify-content-between">
    <h1>My Users</h1><a class="btn btn-primary" href="{% url 'add_user' %}">Add User</a>
</div>
<div class="card mt-3">
    <div class="table-responsive">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody>{% for item in users %}<tr>
                    <td>{{ item.name }}</td>
                    <td>{{ item.username }}</td>
                    <td>{{ item.contact }}</td>
                </tr>{% empty %}<tr>
                    <td colspan="3">No users yet.</td>
                </tr>{% endfor %}</tbody>
        </table>
    </div>
</div>{% endblock %}
