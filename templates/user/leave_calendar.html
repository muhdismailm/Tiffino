{% extends 'base.html' %}{% block title %}Request Leave | Tiffino{% endblock %}{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h1>Request Leave</h1>
                <p class="text-secondary">Available for monthly subscription users.</p>
                <form method="post">{% csrf_token %}{% if form %}{{ form.as_p }}{% else %}
                    <label class="form-label">From date</label><input class="form-control mb-3" type="date"
                        name="from_date" required><label class="form-label">To date</label><input
                        class="form-control mb-3" type="date" name="to_date" required><label
                        class="form-label">Reason</label><textarea class="form-control mb-3" name="reason"
                        rows="3"></textarea>{% endif %}<button class="btn btn-primary">Submit Request</button>
                </form>
            </div>
        </div>
    </div>
</div>{% endblock %}
