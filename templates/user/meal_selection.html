{% extends 'base.html' %}{% block title %}Meal Selection | Tiffino{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body"><h1>Select Your Meals</h1><p class="text-secondary">Update your selection before 8:00 PM on the previous day.</p><form method="post">{% csrf_token %}
<label class="form-label">Meal date</label><input class="form-control mb-3" type="date" name="date" value="{{ selected_date|default:'' }}" required>
{% for field in form %}<div class="form-check form-switch mb-3">{{ field }} <label class="form-check-label">{{ field.label }}</label></div>{% endfor %}
<button class="btn btn-primary">Save Selection</button></form></div></div></div></div>{% endblock %}
